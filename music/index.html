
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atmansyah Music Player</title>

<style>
* { box-sizing: border-box; }

body {
  background: linear-gradient(135deg,#dbeafe,#eff6ff,#e0e7ff);
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
  overflow: hidden;
}

.player {
  position: relative;
  background: white;
  padding: 35px;
  border-radius: 24px;
  text-align: center;
  width: min(340px,85vw);
  box-shadow: 0 15px 40px #1e40af25;
  overflow: hidden;
  z-index: 2;
}

h2 { color: #172554; }
p { color: #64748b; }

.disc {
  font-size: 85px;
  display: inline-block;
  animation: float 3s ease-in-out infinite;
}

.player.playing .disc {
  animation: spin 4s linear infinite;
}

audio {
  width: 100%;
  margin-top: 15px;
}

.note {
  position: fixed;
  bottom: -50px;
  font-size: 28px;
  animation: rise 9s linear infinite;
  opacity: 0;
  pointer-events: none;
}

.n1 { left: 10%; animation-delay: 0s; }
.n2 { left: 25%; animation-delay: 3s; }
.n3 { left: 70%; animation-delay: 1s; }
.n4 { left: 88%; animation-delay: 5s; }

.star {
  position: fixed;
  animation: twinkle 2s ease-in-out infinite alternate;
  pointer-events: none;
}

.s1 { top: 15%; left: 15%; }
.s2 { top: 25%; right: 15%; animation-delay: 1s; }
.s3 { bottom: 18%; left: 20%; animation-delay: .5s; }
.s4 { bottom: 20%; right: 20%; animation-delay: 1.5s; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

@keyframes rise {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: .8; }
  100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

@keyframes twinkle {
  from { opacity: .3; transform: scale(.8); }
  to { opacity: 1; transform: scale(1.3); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div class="note n1">🎵</div>
<div class="note n2">🎶</div>
<div class="note n3">🎼</div>
<div class="note n4">🎵</div>

<div class="star s1">✨</div>
<div class="star s2">⭐</div>
<div class="star s3">✨</div>
<div class="star s4">💫</div>

<div class="player" id="player">
  <div class="disc">💿</div>
  <h2>Atmansyah Music</h2>
  <p>My Favorite Song 🎧</p>

  <audio controls id="music">
    <source src="../background.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>
</div>

<script>
const music = document.getElementById("music");
const player = document.getElementById("player");

music.addEventListener("play", () => {
  player.classList.add("playing");
});

music.addEventListener("pause", () => {
  player.classList.remove("playing");
});

music.addEventListener("ended", () => {
  player.classList.remove("playing");
});
</script>

</body>
</html>
