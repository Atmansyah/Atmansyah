
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atmansyah Music Player</title>
<style>
body {
  background: linear-gradient(135deg,#dbeafe,#eff6ff);
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
}
.player {
  background: white;
  padding: 35px;
  border-radius: 20px;
  text-align: center;
  width: min(300px,75vw);
  box-shadow: 0 10px 35px #0002;
}
.disc { font-size: 75px; margin: 15px; }
h2 { color: #172554; }
p { color: #64748b; }
audio { width: 100%; }
</style>
</head>
<body>
<div class="player">
  <div class="disc">🎵</div>
  <h2>Atmansyah Music</h2>
  <p>My Favorite Song</p>
  <audio controls>
    <source src="../background.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>
</div>
</body>
</html>
